# Dev overrides, merged automatically by `docker compose`. Only `api` uses the dev target (source
# mounts, reload); `migrate` keeps the runtime image, which has the entrypoint and migrations.
services:
  api:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
    command: uvicorn src.main:app --reload --host 0.0.0.0 --port 8000
    environment:
      LOG_LEVEL: debug

  frontend:
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev -- -H 0.0.0.0 -p 3000
    environment:
      NODE_ENV: development
