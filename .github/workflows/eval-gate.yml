name: Eval Gate

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # Throwaway pgvector and single-node Kafka for the integration tests (same tags as ci.yml).
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16
        env:
          POSTGRES_DB: finadvisor_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      kafka:
        image: apache/kafka:4.4.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    # Throwaway, non-placeholder values so the typed Settings boot; never real secrets. DB_* point
    # at the postgres service: the integration tests build their database URL from them.
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: finadvisor_test
      DB_USER: test
      DB_PASSWORD: test
      DB_POOL_SIZE: "5"
      DB_STATEMENT_TIMEOUT_MS: "30000"
      ANTHROPIC_API_KEY: ci-unused-anthropic-key
      ANTHROPIC_BASE_URL: https://api.anthropic.com
      VOYAGE_API_KEY: ci-unused-voyage-key
      JWT_SECRET: ci-unused-jwt-secret-0123456789-abcdefghij
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install "poetry==2.1.2"
          poetry install --with dev --no-interaction --no-root

      - name: Lint
        run: poetry run ruff check .

      - name: Format check
        run: poetry run ruff format --check .

      - name: Typecheck
        run: poetry run mypy src/

      - name: Unit tests
        # Needs no service: the unit tests never open a connection.
        run: poetry run pytest -m "not integration" -x --tb=short

      - name: Integration tests (Postgres, Kafka)
        # REQUIRE_SERVICES=1: an unreachable service or a missing psql/pg_dump fails the run
        # instead of skipping tests and passing silently.
        run: |
          psql --version
          pg_dump --version
          pg_isready -h localhost -U test
          poetry run pytest -m integration -x --tb=short
        env:
          REQUIRE_SERVICES: "1"
          KAFKA_BOOTSTRAP: localhost:9092

  # The eval gate needs real API keys. Without them eval-gate shows as Skipped (gray), never as
  # a fake green, and this job leaves a visible notice. Keys are never faked.
  secrets-check:
    runs-on: ubuntu-latest
    outputs:
      has_keys: ${{ steps.check.outputs.has_keys }}
    steps:
      - name: Check eval secrets
        id: check
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] && [ -n "$VOYAGE_API_KEY" ]; then
            echo "has_keys=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::eval-gate skipped: ANTHROPIC_API_KEY/VOYAGE_API_KEY secrets not configured"
            echo "has_keys=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}

  eval-gate:
    needs: [lint-and-test, secrets-check]
    if: needs.secrets-check.outputs.has_keys == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16
        env:
          POSTGRES_DB: finadvisor_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install "poetry==2.1.2"
          poetry install --with dev --no-interaction
        working-directory: backend

      - name: Setup DB and seed eval data
        run: |
          psql -h localhost -U test -d finadvisor_test -f db/schema.sql
          poetry run python scripts/ingest.py --target test
        working-directory: backend
        env:
          PGPASSWORD: test
          # --target test appends _test to DB_NAME, so this ingests into finadvisor_test.
          DB_HOST: localhost
          DB_NAME: finadvisor
          DB_USER: test
          DB_PASSWORD: test
          DB_POOL_SIZE: "5"
          DB_STATEMENT_TIMEOUT_MS: "30000"
          JWT_SECRET: eval-gate-unused-jwt-secret-0123456789
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}

      - name: Start backend
        run: |
          poetry run uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_NAME: finadvisor_test
          DB_USER: test
          DB_PASSWORD: test
          DB_POOL_SIZE: "5"
          DB_STATEMENT_TIMEOUT_MS: "30000"
          JWT_SECRET: eval-gate-unused-jwt-secret-0123456789
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          LANGFUSE_ENABLED: "true"
          LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST || 'https://cloud.langfuse.com' }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}

      - name: Run eval set
        run: |
          poetry run python scripts/run_eval.py \
            --eval-set ../data/eval/golden_qa.json \
            --output ../eval_results.json \
            --api-base http://localhost:8000
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Check thresholds
        working-directory: backend
        run: |
          poetry run python -c "
          import json, sys
          results = json.load(open('../eval_results.json'))
          agg = results['aggregate']
          faith = agg['avg_faithfulness']
          cite = agg['avg_citation_accuracy']
          print(f'Faithfulness: {faith:.2%}')
          print(f'Citation accuracy: {cite:.2%}')
          if cite < 0.95:
              print('CITATION ACCURACY BELOW 95% - DEPLOY BLOCKED')
              sys.exit(1)
          if faith < 0.90:
              print('FAITHFULNESS BELOW 90% - DEPLOY BLOCKED')
              sys.exit(1)
          print('Eval gate passed')
          "

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval_results.json
