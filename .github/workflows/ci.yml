name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # Throwaway pgvector for the migration integration tests (same tag as eval-gate and Cloud SQL).
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16
        env:
          POSTGRES_DB: finadvisor_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install "poetry==2.1.2"
          poetry install --with dev --no-interaction --no-root

      - name: Lint
        run: poetry run ruff check .

      - name: Format check
        run: poetry run ruff format --check .

      - name: Type check
        run: poetry run mypy src/

      - name: Unit tests
        run: poetry run pytest tests/ -v --tb=short
        # Throwaway, non-placeholder values so the typed Settings boot; never real secrets.
        # No TEST_DATABASE_URL here, so DB-backed tests skip.
        env:
          DB_HOST: db.ci.invalid
          DB_NAME: finadvisor_ci
          DB_USER: ci_user
          DB_PASSWORD: ci-unused-db-pass
          DB_POOL_SIZE: "5"
          DB_STATEMENT_TIMEOUT_MS: "30000"
          ANTHROPIC_API_KEY: ci-unused-anthropic-key
          ANTHROPIC_BASE_URL: https://api.anthropic.com
          VOYAGE_API_KEY: ci-unused-voyage-key
          JWT_SECRET: ci-unused-jwt-secret-0123456789-abcdefghij

      - name: Migration tests (Postgres)
        # Only these files get TEST_DATABASE_URL: the rest of the DB-backed suite needs seeded
        # data (ingest with real keys) and runs in eval-gate. psql/pg_dump must exist, or the
        # migration tests would skip and pass silently.
        run: |
          psql --version
          pg_dump --version
          pg_isready -h localhost -U test
          poetry run pytest tests/test_migrations.py tests/test_entrypoint.py -v --tb=short
        env:
          DB_HOST: db.ci.invalid
          DB_NAME: finadvisor_ci
          DB_USER: ci_user
          DB_PASSWORD: ci-unused-db-pass
          DB_POOL_SIZE: "5"
          DB_STATEMENT_TIMEOUT_MS: "30000"
          ANTHROPIC_API_KEY: ci-unused-anthropic-key
          ANTHROPIC_BASE_URL: https://api.anthropic.com
          VOYAGE_API_KEY: ci-unused-voyage-key
          JWT_SECRET: ci-unused-jwt-secret-0123456789-abcdefghij
          TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/finadvisor_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  compose:
    # Brings the whole stack up with throwaway values and checks the acceptance criteria of
    # docker-compose.yml (healthy services, stray listeners, probes, clean teardown).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: fa-ci-${{ github.run_id }}-${{ github.run_attempt }}
      # Only the base file: no docker-compose.override.yml, so api and migrate share the runtime image.
      COMPOSE_FILE: docker-compose.yml
    steps:
      - uses: actions/checkout@v4

      - name: Compose acceptance checks
        # check_compose.sh builds its own throwaway .env from .env.example (never real secrets).
        run: tests/compose/check_compose.sh

      - name: Tear down
        if: always()
        # The script cleans up after itself; this covers a runner that is cancelled mid-run. Its
        # env file is gone by now, so the throwaway values below only satisfy the required keys.
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env.example down -v
          docker compose -p "${COMPOSE_PROJECT_NAME}-other" --env-file .env.example down -v
        env:
          DB_USER: ci_user
          DB_PASSWORD: ci-unused-db-pass
          ANTHROPIC_API_KEY: ci-unused-anthropic-key
          VOYAGE_API_KEY: ci-unused-voyage-key
          JWT_SECRET: ci-unused-jwt-secret-0123456789-abcdefghij

  stub-chat-api:
    # Test tooling for the gateway epic (tools/stub-chat-api): lint, format, unit tests with a
    # coverage floor, and the image acceptance script (build, run, curl, docker stop).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/stub-chat-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Unit tests
        run: pytest --cov=app --cov=config --cov=serve --cov=tokens --cov-fail-under=80

      - name: Image acceptance checks
        run: bash tests/check_image.sh

  terraform-edge:
    # terraform/edge/ (ADR-024 network): format, validate and plan-level tests with a mocked
    # provider (no credentials, no project), plus the no-NAT / no-connector policy check.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform/edge
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Test (mocked provider)
        run: terraform test

      - name: Policy check on terraform/ (no Cloud NAT, no VPC connector)
        working-directory: .
        run: scripts/check_no_nat.sh terraform

      - name: Policy check negative fixtures
        working-directory: .
        run: tests/terraform/check_no_nat_test.sh
