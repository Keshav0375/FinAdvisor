name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # Throwaway pgvector and single-node Kafka for the integration tests (same tags as compose,
    # eval-gate and Cloud SQL).
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16
        env:
          POSTGRES_DB: finadvisor_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      kafka:
        image: apache/kafka:4.4.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    # Throwaway, non-placeholder values so the typed Settings boot; never real secrets. DB_* point
    # at the postgres service: the integration tests build their database URL from them.
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: finadvisor_test
      DB_USER: test
      DB_PASSWORD: test
      DB_POOL_SIZE: "5"
      DB_STATEMENT_TIMEOUT_MS: "30000"
      ANTHROPIC_API_KEY: ci-unused-anthropic-key
      ANTHROPIC_BASE_URL: https://api.anthropic.com
      VOYAGE_API_KEY: ci-unused-voyage-key
      JWT_SECRET: ci-unused-jwt-secret-0123456789-abcdefghij
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install "poetry==2.1.2"
          poetry install --with dev --no-interaction --no-root

      - name: Lint
        run: poetry run ruff check .

      - name: Format check
        run: poetry run ruff format --check .

      - name: Type check
        run: poetry run mypy src/

      - name: Unit tests
        # Needs no service: the unit tests never open a connection.
        run: poetry run pytest -m "not integration" -v --tb=short

      - name: Integration tests (Postgres, Kafka)
        # REQUIRE_SERVICES=1: an unreachable service or a missing psql/pg_dump fails the run
        # instead of skipping tests and passing silently.
        run: |
          psql --version
          pg_dump --version
          pg_isready -h localhost -U test
          poetry run pytest -m integration -v --tb=short
        env:
          REQUIRE_SERVICES: "1"
          KAFKA_BOOTSTRAP: localhost:9092

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  compose:
    # Brings the whole stack up with throwaway values and checks the acceptance criteria of
    # docker-compose.yml (healthy services, stray listeners, probes, clean teardown).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: fa-ci-${{ github.run_id }}-${{ github.run_attempt }}
      # Only the base file: no docker-compose.override.yml, so api and migrate share the runtime image.
      COMPOSE_FILE: docker-compose.yml
    steps:
      - uses: actions/checkout@v4

      - name: Compose acceptance checks
        # check_compose.sh builds its own throwaway .env from .env.example (never real secrets).
        run: tests/compose/check_compose.sh

      - name: Tear down
        if: always()
        # The script cleans up after itself; this covers a runner that is cancelled mid-run. Its
        # env file is gone by now, so the throwaway values below only satisfy the required keys.
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env.example down -v
          docker compose -p "${COMPOSE_PROJECT_NAME}-other" --env-file .env.example down -v
        env:
          DB_USER: ci_user
          DB_PASSWORD: ci-unused-db-pass
          ANTHROPIC_API_KEY: ci-unused-anthropic-key
          VOYAGE_API_KEY: ci-unused-voyage-key
          JWT_SECRET: ci-unused-jwt-secret-0123456789-abcdefghij
