name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # Throwaway pgvector for the migration integration tests (same tag as eval-gate and Cloud SQL).
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16
        env:
          POSTGRES_DB: finadvisor_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install "poetry==2.1.2"
          poetry install --with dev --no-interaction --no-root

      - name: Lint
        run: poetry run ruff check .

      - name: Format check
        run: poetry run ruff format --check .

      - name: Type check
        run: poetry run mypy src/

      - name: Unit tests
        run: poetry run pytest tests/ -v --tb=short
        # Throwaway, non-placeholder values so the typed Settings boot; never real secrets.
        # No TEST_DATABASE_URL here, so DB-backed tests skip.
        env:
          DB_HOST: db.ci.invalid
          DB_NAME: finadvisor_ci
          DB_USER: ci_user
          DB_PASSWORD: ci-unused-db-pass
          DB_POOL_SIZE: "5"
          DB_STATEMENT_TIMEOUT_MS: "30000"
          ANTHROPIC_API_KEY: ci-unused-anthropic-key
          ANTHROPIC_BASE_URL: https://api.anthropic.com
          VOYAGE_API_KEY: ci-unused-voyage-key
          JWT_SECRET: ci-unused-jwt-secret-0123456789-abcdefghij

      - name: Migration tests (Postgres)
        # Only these files get TEST_DATABASE_URL: the rest of the DB-backed suite needs seeded
        # data (ingest with real keys) and runs in eval-gate. psql/pg_dump must exist, or the
        # migration tests would skip and pass silently.
        run: |
          psql --version
          pg_dump --version
          pg_isready -h localhost -U test
          poetry run pytest tests/test_migrations.py tests/test_entrypoint.py -v --tb=short
        env:
          DB_HOST: db.ci.invalid
          DB_NAME: finadvisor_ci
          DB_USER: ci_user
          DB_PASSWORD: ci-unused-db-pass
          DB_POOL_SIZE: "5"
          DB_STATEMENT_TIMEOUT_MS: "30000"
          ANTHROPIC_API_KEY: ci-unused-anthropic-key
          ANTHROPIC_BASE_URL: https://api.anthropic.com
          VOYAGE_API_KEY: ci-unused-voyage-key
          JWT_SECRET: ci-unused-jwt-secret-0123456789-abcdefghij
          TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/finadvisor_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
