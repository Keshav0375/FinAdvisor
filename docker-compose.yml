# Local stack: postgres, kafka, migrate (one-shot), api, frontend. `docker compose up -d --wait`
# brings it up healthy. Host ports bind to 127.0.0.1 and are overridable (see .env.example), so
# two projects (`-p`) run side by side. Required secrets have no default (G-25).

x-backend-env: &backend-env
  # Fixed inside the compose network.
  - DB_HOST=postgres
  - DB_PORT=5432
  - PORT=8000
  # Required, no default.
  - DB_NAME=${DB_NAME:?set DB_NAME in .env}
  - DB_USER=${DB_USER:?set DB_USER in .env}
  - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
  - DB_POOL_SIZE=${DB_POOL_SIZE:?set DB_POOL_SIZE in .env}
  - DB_STATEMENT_TIMEOUT_MS=${DB_STATEMENT_TIMEOUT_MS:?set DB_STATEMENT_TIMEOUT_MS in .env}
  - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
  - VOYAGE_API_KEY=${VOYAGE_API_KEY:?set VOYAGE_API_KEY in .env}
  - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
  - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
  # Optional Settings keys: passed through only when set, so config.py keeps the defaults.
  - ENV_PROFILE
  - DB_CONNECT_TIMEOUT_S
  - LLM_MODEL_ANSWER
  - LLM_MODEL_AUX
  - LLM_MODEL_JUDGE
  - LLM_MODEL_FALLBACK
  - LLM_FALLBACK_ENABLED
  - LLM_MAX_ITERATIONS
  - MODEL_RETIRE_WARN_DAYS
  - LANGFUSE_ENABLED
  - LANGFUSE_HOST
  - LANGFUSE_PUBLIC_KEY
  - LANGFUSE_SECRET_KEY
  - READINESS_TIMEOUT_S
  - READINESS_CACHE_TTL_S
  - PII_MODE
  - GCP_PROJECT_ID

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg16
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node KRaft. Variables follow the official example
  # apache/kafka docker/examples/docker-compose-files/single-node/plaintext/docker-compose.yml:
  # PLAINTEXT is the in-network listener (kafka:19092), PLAINTEXT_HOST the host listener, advertised
  # on KAFKA_HOST_PORT and published on the same number.
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:${KAFKA_HOST_PORT:-9092}"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:${KAFKA_HOST_PORT:-9092}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 20s

  # One-shot: alembic upgrade head on the runtime image (ENTRYPOINT python -m src.entrypoint).
  migrate:
    build: ./backend
    command: ["jobs", "migrate"]
    restart: "no"
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      # Vite dev-server proxy target for /v1 and /api (read by vite.config.ts inside the
      # container, so it names the compose service, not a host port).
      VITE_DEV_PROXY_TARGET: ${VITE_DEV_PROXY_TARGET:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # node:20-slim has no curl; Node 20 has a global fetch.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 60s

volumes:
  pgdata:
  kafkadata:
